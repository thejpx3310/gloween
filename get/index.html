<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading Resource — Gloween</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #FAF7F0;
      color: #1A2421;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1.5px solid #E5DEC9;
      border-radius: 20px;
      padding: 36px 24px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #15211D;
      letter-spacing: -0.01em;
    }
    .filename {
      display: inline-block;
      background: #F4EFE6;
      border: 1px solid #D9CFBF;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #8A1E11;
      margin-bottom: 16px;
      word-break: break-all;
    }
    p {
      font-size: 14px;
      color: #6A7670;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #28543E;
      color: #FAF6ED;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(40, 84, 62, 0.28);
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
      background: #1C3B2C;
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .brand {
      margin-top: 24px;
      font-size: 12px;
      color: #8C9893;
      font-weight: 600;
    }
    .brand a {
      color: #28543E;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📥</div>
    <h1>Your Download is Starting...</h1>
    <div class="filename" id="fileDisplay">Loading resource...</div>
    <p>Your file is downloading directly to your phone. If it doesn't start, tap the button below:</p>
    
    <button id="downloadBtn" class="btn" onclick="triggerForcedDownload()">
      <span id="btnText">Tap Here to Download (PDF)</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </button>

    <div class="brand">
      © 2026 <a href="/">Gloween</a> · Creator Vault
    </div>
  </div>

  <script>
    // Universal URL Parser: Reads ?file=FileName.pdf
    const urlParams = new URLSearchParams(window.location.search);
    const requestedFile = urlParams.get('file') || 'JAPAN REEL TUTORIALS.pdf';
    const cleanName = decodeURIComponent(requestedFile);
    document.getElementById('fileDisplay').textContent = cleanName;

    const fileUrl = '/' + encodeURI(requestedFile);

    // Force real file download using Blob
    async function triggerForcedDownload() {
      const btn = document.getElementById('downloadBtn');
      const btnText = document.getElementById('btnText');
      btnText.textContent = 'Downloading...';
      btn.disabled = true;

      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('Network error');
        const blob = await response.blob();
        
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = cleanName;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          window.URL.revokeObjectURL(blobUrl);
          document.body.removeChild(a);
          btnText.textContent = 'Downloaded! Tap to re-download';
          btn.disabled = false;
        }, 1500);
      } catch (err) {
        const fallback = document.createElement('a');
        fallback.href = fileUrl;
        fallback.download = cleanName;
        document.body.appendChild(fallback);
        fallback.click();
        document.body.removeChild(fallback);
        btnText.textContent = 'Tap Here to Download (PDF)';
        btn.disabled = false;
      }
    }

    // Auto-trigger on page load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        triggerForcedDownload();
      }, 400);
    });
  </script>
</body>
</html>
